<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thực Hành B4 - Nhiệm vụ 1 & 2</title>
  <link rel="stylesheet" href="./input.css">
  <style>
    /* 1. CSS trạng thái UI chung */
    .hidden { display: none !important; }
    .overflow-hidden { overflow: hidden; }
    .shadow-sm { box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: box-shadow 0.3s; }
    
    /* Dark mode cơ bản */
    body.dark-mode {
      background-color: #121212;
      color: #ffffff;
    }
    body.dark-mode header,
    body.dark-mode #menu {
      background-color: #1e1e1e;
      color: #ffffff;
    }

    /* 2. Header & Mobile Menu */
    header { 
      position: sticky; 
      top: 0; 
      background: #fff; 
      z-index: 100; 
      padding: 15px 20px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      border-bottom: 1px solid #ddd; 
    }
    #nav-sentinel { 
      position: absolute; 
      top: 0; 
      left: 0; 
      height: 1px; 
      width: 100%; 
      pointer-events: none; 
    }
    #menu { 
      position: absolute; 
      top: 100%; 
      left: 0; 
      width: 100%; 
      background: #fff; 
      padding: 20px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
    }
    
    /* 3. Style nút Back To Top (Cấu hình cho TODO 5 & 6) */
    #back-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 10px 15px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      z-index: 99;
    }

    /* Bật nút hiển thị khi JS toggle class .is-visible */
    #back-to-top.is-visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body tabindex="-1">

  <!-- Sentinel nhận diện vị trí đầu trang (NV1 & NV2) -->
  <div id="nav-sentinel"></div>

  <!-- Header -->
  <header id="main-header">
    <nav id="main-nav">
      <h2 style="margin:0;">Logo</h2>
    </nav>

    <!-- Nút Đổi Theme -->
    <button id="theme-toggle">Đổi Theme</button>

    <!-- Nút Toggle Mobile Menu (NV2) -->
    <button id="menu-toggle" aria-expanded="false" aria-label="Mở menu">
      ☰ Menu
    </button>

    <!-- Mobile Menu (NV2) -->
    <div id="menu" class="hidden">
      <ul>
        <li><a href="#">Trang chủ</a></li>
        <li><a href="#">Dịch vụ</a></li>
        <li><a href="#">Liên hệ</a></li>
      </ul>
    </div>
  </header>

  <!-- Nội dung trang (Tạo độ cao 1500px để cuộn trang) -->
  <main style="height: 1500px; padding: 20px;">
    <h1>Nhiệm vụ 1 & 2 - Demo Thực Hành</h1>
    <p>Cuộn xuống dưới để test nút "Lên đầu trang" và hiệu ứng bóng đổ Navbar.</p>
    
    <!-- Khối FAQ -->
    <section id="faq" style="margin-top: 50px; max-width: 600px;">
      <h2>Câu hỏi thường gặp (FAQ)</h2>

      <div class="faq-item" style="border-bottom: 1px solid #ccc; margin-bottom: 10px;">
        <button class="faq-question" style="width: 100%; text-align: left; padding: 10px; background: #f9f9f9; border: none; cursor: pointer; font-weight: bold;">
          ❓ Dự án này sử dụng công nghệ gì?
        </button>
        <div class="faq-answer" style="display: none; padding: 10px;">
          <p>Dự án sử dụng HTML5, CSS3 và JS ES Modules.</p>
        </div>
      </div>

      <div class="faq-item" style="border-bottom: 1px solid #ccc; margin-bottom: 10px;">
        <button class="faq-question" style="width: 100%; text-align: left; padding: 10px; background: #f9f9f9; border: none; cursor: pointer; font-weight: bold;">
          ❓ Tại sao lại dùng IntersectionObserver?
        </button>
        <div class="faq-answer" style="display: none; padding: 10px;">
          <p>Để tối ưu hiệu năng, tránh bắt sự kiện window.scroll bắn hàng trăm lần/giây.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Nút Lên đầu trang (TODO 5 & 6) -->
  <button id="back-to-top">↑ Lên đầu trang</button>

  <!-- Nhúng JS Module chính -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
