<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Globe</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Compiled Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="min-h-screen bg-white text-gray-800">

    <main class="relative mx-auto h-[1024px] w-[1440px]">

        <!-- LOGO -->
        <a href="./landingpage.html" class="absolute left-[104px] top-[30px] text-[25px] font-bold hover:opacity-80 transition-opacity">
            g<span class="text-[#8BD4BD]">l</span>obe
        </a>

        <!-- LEFT IMAGE (Cấu trúc tương tự Login, chuyển sang vị trí bên trái) -->
        <div class="absolute left-[104px] top-[104px] h-[816px] w-[512px] overflow-hidden rounded-2xl">
            <!-- Ảnh sử dụng dịch vụ Lorem Picsum online không lo lỗi/tốn dung lượng -->
            <img src="https://picsum.photos/600/900?random=10" alt="Sign Up Background" class="h-full w-full object-cover">

            <!-- Dots -->
            <div class="absolute bottom-[18px] left-1/2 flex -translate-x-1/2 items-center gap-[5px]">
                <span class="h-[7px] w-[22px] rounded-full bg-[#8BD4BD]"></span>
                <span class="h-[7px] w-[7px] rounded-full bg-white"></span>
                <span class="h-[7px] w-[7px] rounded-full bg-white"></span>
            </div>
        </div>

        <!-- RIGHT FORM CONTENT -->
        <div class="absolute left-[720px] top-[104px] flex w-[512px] flex-col">

            <div class="mb-[24px]">
                <h1 class="mb-[8px] text-[34px] font-semibold leading-none">
                    Sign up
                </h1>
                <p class="text-[13px] leading-[1.5] text-gray-500">
                    Let's get you all set up so you can access your personal account.
                </p>
            </div>

            <!-- FORM -->
            <form id="signupForm" class="flex flex-col gap-3">

                <!-- FIRST NAME + LAST NAME -->
                <div class="flex gap-3">
                    <div class="relative w-1/2">
                        <label for="firstName" class="absolute -top-[7px] left-[10px] bg-white px-1 text-[11px] text-gray-500 z-10">
                            First Name
                        </label>
                        <input id="firstName" name="firstName" type="text" placeholder="John" class="h-[42px] w-full rounded-[3px] border border-gray-400 px-3 text-[13px] outline-none transition focus:border-[#8BD4BD]">
                    </div>

                    <div class="relative w-1/2">
                        <label for="lastName" class="absolute -top-[7px] left-[10px] bg-white px-1 text-[11px] text-gray-500 z-10">
                            Last Name
                        </label>
                        <input id="lastName" name="lastName" type="text" placeholder="Doe" class="h-[42px] w-full rounded-[3px] border border-gray-400 px-3 text-[13px] outline-none transition focus:border-[#8BD4BD]">
                    </div>
                </div>

                <!-- EMAIL + PHONE -->
                <div class="flex gap-3">
                    <div class="relative w-1/2">
                        <label for="email" class="absolute -top-[7px] left-[10px] bg-white px-1 text-[11px] text-gray-500 z-10">
                            Email
                        </label>
                        <input id="email" name="email" type="email" placeholder="john.doe@gmail.com" class="h-[42px] w-full rounded-[3px] border border-gray-400 px-3 text-[13px] outline-none transition focus:border-[#8BD4BD]">
                    </div>

                    <div class="relative w-1/2">
                        <label for="phone" class="absolute -top-[7px] left-[10px] bg-white px-1 text-[11px] text-gray-500 z-10">
                            Phone Number
                        </label>
                        <input id="phone" name="phone" type="tel" placeholder="0912 345 678" class="h-[42px] w-full rounded-[3px] border border-gray-400 px-3 text-[13px] outline-none transition focus:border-[#8BD4BD]">
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="relative">
                    <label for="password" class="absolute -top-[7px] left-[10px] bg-white px-1 text-[11px] text-gray-500 z-10">
                        Password
                    </label>
                    <input id="password" name="password" type="password" placeholder="Enter your password" class="h-[42px] w-full rounded-[3px] border border-gray-400 px-3 pr-10 text-[13px] outline-none transition focus:border-[#8BD4BD]">
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm">
                        ◉
                    </button>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="relative">
                    <label for="confirmPassword" class="absolute -top-[7px] left-[10px] bg-white px-1 text-[11px] text-gray-500 z-10">
                        Confirm Password
                    </label>
                    <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm your password" class="h-[42px] w-full rounded-[3px] border border-gray-400 px-3 pr-10 text-[13px] outline-none transition focus:border-[#8BD4BD]">
                    <button type="button" id="toggleConfirmPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm">
                        ◉
                    </button>
                </div>

                <!-- TERMS & CONDITIONS -->
                <div class="mt-1 flex items-center gap-2">
                    <input id="terms" name="terms" type="checkbox" class="h-4 w-4 cursor-pointer">
                    <label for="terms" class="text-[11px] text-gray-700 cursor-pointer">
                        I agree to all the <a href="#" class="text-red-400 hover:underline">Terms</a> and <a href="#" class="text-red-400 hover:underline">Privacy Policies</a>
                    </label>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="mt-2 h-[38px] w-full rounded-[3px] bg-[#8BD4BD] text-[12px] font-semibold text-black transition hover:opacity-90">
                    Create account
                </button>

            </form>

            <!-- LOGIN LINK -->
            <div class="mt-3 text-center text-[11px]">
                Already have an account?
                <a href="./login.html" class="font-medium text-red-400 hover:underline">
                    Login
                </a>
            </div>

            <!-- DIVIDER -->
            <div class="mt-[20px] flex items-center gap-3">
                <span class="h-px flex-1 bg-gray-200"></span>
                <p class="whitespace-nowrap text-[11px] text-gray-400">
                    Or sign up with
                </p>
                <span class="h-px flex-1 bg-gray-200"></span>
            </div>

            <!-- SOCIAL SIGNUP -->
            <div class="mt-4 flex gap-3">
                <button type="button" class="flex h-[42px] w-1/3 items-center justify-center rounded-[3px] border border-[#8BD4BD] bg-white text-xl font-bold text-blue-500 hover:bg-gray-50 transition-colors">
                    f
                </button>
                <button type="button" class="flex h-[42px] w-1/3 items-center justify-center rounded-[3px] border border-[#8BD4BD] bg-white text-xl font-bold text-blue-500 hover:bg-gray-50 transition-colors">
                    G
                </button>
                <button type="button" class="flex h-[42px] w-1/3 items-center justify-center rounded-[3px] border border-[#8BD4BD] bg-white text-xl font-bold text-black hover:bg-gray-50 transition-colors">
                    ●
                </button>
            </div>

        </div>

    </main>

    <script src="./js/signup.js"></script>
</body>
</html>
